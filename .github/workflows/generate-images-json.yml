name: Generate images.json

on:
  push:
    branches: [main]
    paths:
      - "images/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-images-json
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate images.json
        shell: python
        run: |
          import json
          from pathlib import Path

          EXTS = {".jpg", ".jpeg", ".png", ".webp", ".avif", ".gif"}
          LOGO_EXTS = {".png", ".jpg", ".jpeg", ".webp", ".svg"}
          LOGOS = "00-logos"
          root = Path("images")

          def visible(p):
              return not p.name.startswith(".")

          def files(d, exts):
              return [rel(p) for p in sorted(d.iterdir(), key=lambda p: p.name)
                      if p.is_file() and visible(p) and p.suffix.lower() in exts]

          def subdirs(d):
              return sorted((c for c in d.iterdir() if c.is_dir() and visible(c)), key=lambda c: c.name)

          def rel(p):
              # Relative path, forward slashes, no leading slash
              return p.as_posix().lstrip("/")

          def entry(slug, images):
              return {"slug": slug, "cover": images[0] if images else None, "images": images}

          data = {"hero": None, "projects": []}

          if root.is_dir():
              heroes = sorted(rel(p) for p in root.glob("hero.*")
                              if p.is_file() and p.suffix.lower() in EXTS)
              if heroes:
                  data["hero"] = heroes[0]

              logos_dir = root / LOGOS
              if logos_dir.is_dir():
                  data["projects"].append(entry(LOGOS, files(logos_dir, LOGO_EXTS)))

              # images/<studio>/<project>/ -> slug = project folder name.
              # Loose files directly inside a studio folder are ignored.
              for studio in subdirs(root):
                  if studio.name == LOGOS:
                      continue
                  for project in subdirs(studio):
                      data["projects"].append(entry(project.name, files(project, EXTS)))

          Path("images.json").write_text(json.dumps(data, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          print(f"hero: {data['hero']}, projects: {len(data['projects'])}")

      - name: Commit images.json if changed
        run: |
          if git diff --quiet -- images.json && [ -z "$(git ls-files --others --exclude-standard -- images.json)" ]; then
            echo "images.json unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images.json
          git commit -m "chore: regenerate images.json"
          git pull --rebase origin main
          git push origin HEAD:main
