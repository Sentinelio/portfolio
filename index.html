document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

 'The Sexy Brutale',\n      meta: 'Tequila Works · Madrid · Apr 2015 · Unity 5 · PS4, Xbox One, Switch, PC · 83 Metacritic',\n      role: 'Additional Senior Level Designer',\n      hero: '',\n      desc: 'A murder-mystery adventure inside a haunted mansion. Built the systems that let the team iterate quickly on its intricate spaces.',\n      resp: [\n        'Creation and implementation of a metrics system fitting the visual style of the game',\n        'Tileset system so designers and artists could work more comfortably with the scenarios'\n      ],\n      videos: ['https://www.youtube.com/embed/F4F5Zeww1iU'],\n      shots: []\n    },\n    wanted: {\n      title: 'Wanted: Weapons of Fate',\n      meta: 'Grin · Barcelona · Dec 2007–Apr 2009 · Diesel Engine · PS3, Xbox 360, PC · 62 Metacritic',\n      role: 'Level Designer',\n      hero: '',\n      desc: 'Third-person action based on the film. Responsible for prototypes and six maps (Courtyard, Cargo, Sniper, Church Entry, Catacombs 1 & 2) · and for the optimization of the whole game on Xbox 360, PS3 and PC.',\n      resp: [\n        'World builder · six maps from prototype to ship',\n        'Mission design and scripting',\n        'Map optimization: occluders, LODs, portals, distance culling',\n        'Optimization with art team: assets, alphas, collisions, FX, lighting',\n        'Optimization with programming: stability, AI'\n      ],\n      videos: ['https://www.youtube.com/embed/aP9NRzgdz6A'],\n      shots: []\n    },\n    ut3: {\n      title: 'UT3: Ageia PhysX Mod',\n      meta: 'Grin · Barcelona · Jul–Dec 2007 · Unreal Engine 3 · Official mod · PC',\n      role: 'Level Designer',\n      hero: '',\n      desc: 'Official PhysX mod for Unreal Tournament 3, built with Ageia (later NVIDIA) in six months · physics-driven level design before it was standard.',\n      resp: [\n        'Implementation of physical objects: posters, walls, woods, snow, scaffolding, columns, debris',\n        'New gameplay using physical objects',\n        'Map optimization'\n      ],\n      videos: ['https://www.youtube.com/embed/lr4OQJgrKNY'],\n      shots: []\n    },\n    commandos: {\n      title: 'Commandos Strike Force',\n      meta: 'Pyro Studios · Madrid · Oct 2004–Mar 2006 · Renderware · PC, PS2, Xbox · 62 Metacritic',\n      role: 'QA Tester',\n      hero: '',\n      desc: 'Where it all started. Intensive testing of single player and multiplayer on PC and PS2 · and the internal test that opened the door into level design.',\n      resp: [\n        'Testing graphics: textures, collisions, lighting',\n        'Testing design: props, NPC behavior, destruction',\n        'Testing programming: stability, AI, multiplayer, menus'\n      ],\n      videos: ['https://www.youtube.com/embed/CdQXFTtPAEQ'],\n      shots: []\n    },\n    strider: {\n      title: 'Strider', meta: 'Grin · Barcelona · May 2009 · Diesel Engine · Xbox 360 · Cancelled', role: 'Level Designer', hero: '',\n      desc: 'One of four demos built in a month at Grin Barcelona trying to save the studio before it went bankrupt. I worked on two of them, including this Strider revival pitch for Xbox 360.',\n      resp: [\n        'Design and creation of the video demo layout in the engine',\n        'Dressing maps with the art department',\n        'Creation of combat situations'\n      ],\n      videos: ['https://www.youtube.com/embed/nilxz8uU1uI'],\n      shots: []\n    },\n    tower: {\n      title: 'Tower', meta: 'Grin · Barcelona · May–Jun 2009 · Diesel Engine · Xbox LIVE Arcade · Cancelled', role: 'Level Designer', hero: '',\n      desc: 'Second of the pitch demos built at Grin Barcelona before the studio closed: an Xbox LIVE Arcade concept.',\n      resp: [\n        'World builder of the video demo layout',\n        'Application of brushes',\n        'Creation of combat and trap situations',\n        'Visual and environment effects with the graphics department'\n      ],\n      videos: ['https://www.youtube.com/embed/hnZeo0uWIqA'],\n      shots: []\n    },\n    cops: {\n      title: 'Cops: The Police Experience', meta: 'Pyro Studios · Madrid · Mar 2006–Jul 2007 · Ignition / UE3 · PC, Xbox 360, PS3 · Cancelled', role: 'Junior Level Designer', hero: '',\n      desc: 'After shipping Commandos Strike Force and Imperial Glory as QA, I passed the internal test and spent a year and a half as Junior Level Designer on this open-world project — my first level design role.',\n      resp: [\n        'World builder in an open world',\n        'NPC scripting',\n        'Visual effects with the graphics department',\n        'Destructions: explosions, destroyed cars, RPG',\n        'Application of specific animation sets',\n        'Vehicle and building explosions',\n        'Environmental effects in the layout',\n        'Sound implementation with programming and sound departments',\n        'Physical objects'\n      ],\n      videos: ['https://www.youtube.com/embed/sJ5VLg7Glgo'],\n      shots: []\n    },\n    imperial: {\n      title: 'Imperial Glory',\n      meta: 'Pyro Studios · Madrid · Oct 2004–Jan 2005 · PC · 69 Metacritic',\n      role: 'QA Tester',\n      hero: '',\n      desc: 'Napoleonic-era strategy from Pyro Studios. Intensive single-player testing on PC across graphics, design and programming.',\n      resp: [\n        'Testing graphics: textures, collisions, lighting',\n        'Testing design: props, NPC behavior, economy',\n        'Testing programming: stability, AI, battles, menus'\n      ],\n      videos: ['https://www.youtube.com/embed/sBh1NeSBLm8'],\n      shots: []\n    }\n  };\n  personal = {\n    ptileset: {\n      title: 'Dynamic Tileset', meta: 'Personal · Unreal Engine 4 · Blueprint tool', role: 'Technical Level Designer', hero: '',\n      desc: 'After building three different tileset systems at Tequila Works, I created my own: a blueprint (based on the SuperGrid Starter Pack material) that modifies the appearance and size of a single cube usable as floor, wall, railing or interactive. Metrics live in the tileset itself, so anyone working with layouts learns them in-game without reading a document, and objects snap to fixed sizes, protecting performance from rescaled meshes.',\n      resp: [\n        'Grid material: size, opacity, colors and background texture',\n        'Normal mapping and roughness controls',\n        'Pulse system to highlight interactive objects',\n        'Layer system to show characters/objects with built-in basic metrics',\n        'Per-face color coding',\n        'Fixed-size scaling to preserve metrics and performance'\n      ],\n      videos: ['https://www.youtube.com/embed/eR-_E0hJsZI'], shots: []\n    },\n    pfinder: {\n      title: 'BP_ActorFinder', meta: 'Personal · Unreal Engine 4 · Blueprint tool · born on Rime', role: 'Technical Level Designer', hero: '',\n      desc: 'On Rime we had serious performance problems on an engine we didn\\u2019t fully control. BP_ActorFinder scans the level and flags problem actors, making it much easier to find mistakes accumulated during map development.',\n      resp: [\n        'Detects objects at 0,0,0',\n        'Flags objects with more than X materials',\n        'Finds rescaled objects',\n        'Finds objects not visible in game or with null mesh',\n        'Reports Tick activated by default'\n      ],\n      videos: [],\n      shots: []\n    },\n    pdebug: {\n      title: 'BP_DebugMenu', meta: 'Personal · Unreal Engine 4 · Blueprint tool · WIP', role: 'Technical Level Designer', hero: '',\n      desc: 'A blueprint placed on the stage that opens a side panel with multiple options to speed up development: cheats for testing, viewport manipulation to find visual problems, filtering by objects added to levels, gameplay tweaks and engine values in the Debug tab.',\n      resp: [\n        'Cheat system to speed up testing',\n        'Viewport manipulation to spot visual problems',\n        'Object filtering per level',\n        'In-game gameplay modification',\n        'Engine value editing from a Debug tab'\n      ],\n      videos: [], shots: []\n    },\n    prebel: {\n      title: 'Rebel Assault', meta: 'Personal · Hammer 2 (Source) · custom map', role: 'Level Designer', hero: '',\n      desc: 'Custom map built in Hammer 2 (Source engine): layout, encounters and set dressing as a personal exercise.',\n      resp: ['Layout and blockout', 'Encounter placement', 'Set dressing and lighting'],\n      videos: [],\n      shots: []\n    },\n    pport: {\n      title: 'Port', meta: 'Personal · Hammer 2 (Source) · custom map', role: 'Level Designer', hero: '',\n      desc: 'Custom map built in Hammer 2 (Source engine): a harbor scenario built as a personal exercise.',\n      resp: ['Layout and blockout', 'Encounter placement', 'Set dressing and lighting'],\n      videos: [],\n      shots: []\n    },\n    pbank: {\n      title: 'Bank', meta: 'Personal · Hammer 2 (Source) · custom map', role: 'Level Designer', hero: '',\n      desc: 'Custom map built in Hammer 2 (Source engine): a bank scenario built as a personal exercise.',\n      resp: ['Layout and blockout', 'Encounter placement', 'Set dressing and lighting'],\n      videos: [],\n      shots: []\n    },\n    pwarehouse: {\n      title: 'Warehouse', meta: 'Personal · Hammer 2 (Source) · custom map', role: 'Level Designer', hero: '',\n      desc: 'Custom map built in Hammer 2 (Source engine): a warehouse scenario built as a personal exercise.',\n      resp: ['Layout and blockout', 'Encounter placement', 'Set dressing and lighting'],\n      videos: [],\n      shots: []\n    },\n    pcourtyard: {\n      title: 'Courtyard', meta: 'Personal · Hammer 2 (Source) · custom map', role: 'Level Designer', hero: '',\n      desc: 'Custom map built in Hammer 2 (Source engine): a courtyard combat space built as a personal exercise.',\n      resp: ['Layout and blockout', 'Encounter placement', 'Set dressing and lighting'],\n      videos: [],\n      shots: []\n    }\n  };\n  componentDidMount() {\n    Object.assign(this.data, this.personal);\n    this.order = [].concat(this.mains, this.also, this.personalIds);\n    Object.keys(this.slugs).forEach(id => { if (this.data[id]) this.data[id].slug = this.slugs[id]; });\n    this.onKey = (e) => {\n      if (!this.state.active) return;\n      if (e.key === 'Escape') this.setState({ active: null });\n      if (e.key === 'ArrowRight') this.step(1);\n      if (e.key === 'ArrowLeft') this.step(-1);\n    };\n    window.addEventListener('keydown', this.onKey);\n    this.timer = setInterval(() => this.setState(s => ({ tick: s.tick + 1 })), 1800);\n    fetch('images.json', { cache: 'no-store' })\n      .then(r => r.ok ? r.json() : Promise.reject(new Error('no index')))\n      .then(json => {\n        const bySlug = {};\n        (json.projects || []).forEach(p => { if (p && p.slug) bySlug[p.slug] = p; });\n        this.setState({ idx: { hero: json.hero || '', bySlug, order: (json.projects || []).map(p => p && p.slug).filter(Boolean) } }, () => {\n          this.checkList([json.hero].concat(Object.keys(bySlug).map(k => bySlug[k].cover)));\n        });\n      })\n      .catch(() => this.setState({ idxFailed: true }));\n  }\n  componentWillUnmount() { window.removeEventListener('keydown', this.onKey); clearInterval(this.timer); }\n  entry(id) {\n    const idx = this.state.idx;\n    const slug = this.slugs[id];\n    if (!idx || !slug) return { cover: '', images: [] };\n    const e = idx.bySlug[slug] || {};\n    const images = (e.images || []).filter(Boolean);\n    return { cover: e.cover || images[0] || '', images };\n  }\n  shotsOf(id) {\n    const e = this.entry(id);\n    const list = e.images.slice();\n    if (e.cover && list.indexOf(e.cover) === -1) list.unshift(e.cover);\n    const bad = this.broken || {};\n    return list.filter(u => u && !bad[u]);\n  }\n  checkList(urls) {\n    this.broken = this.broken || {};\n    this.checked = this.checked || {};\n    (urls || []).forEach(u => {\n      if (!u || this.checked[u]) return;\n      this.checked[u] = true;\n      const img = new Image();\n      img.onerror = () => { this.broken[u] = true; this.forceUpdate(); };\n      img.src = u;\n    });\n  }\n  checkImages(id) {\n    const e = this.entry(id);\n    this.checkList([e.cover].concat(e.images));\n  }\n  open(id) { this.checkImages(id); this.setState({ active: id, mediaIdx: 0 }); window.scrollTo(0, 0); if (this.thumbsEl) this.thumbsEl.scrollTo({ left: 0 }); }\n  step(dir) {\n    const list = this.order || [];\n    const i = list.indexOf(this.state.active);\n    const j = i + dir;\n    if (i < 0 || j < 0 || j >= list.length) return;\n    this.open(list[j]);\n  }\n  scrollBy(el, n) { if (el) el.scrollBy({ left: n * 214, behavior: 'smooth' }); }\n  scrollThumbs(n) {\n    if (!this.thumbsEl) return;\n    const w = 94;\n    const target = this.thumbsEl.scrollLeft + n * w;\n    this.thumbsEl.scrollTo({ left: Math.max(0, target), behavior: 'smooth' });\n  }\n  card(id) {\n    const d = this.data[id] || {};\n    return {\n      title: d.title || id,\n      sub: (d.meta || '').split('·')[0].trim(),\n      img: this.shotsOf(id)[0] || '',\n      noImg: !this.shotsOf(id)[0],\n      initials: (d.title || id).split(' ').map(w => w[0]).join('').slice(0, 3).toUpperCase(),\n      open: () => this.open(id)\n    };\n  }\n  renderVals() {\n    const p = this.state.active ? this.data[this.state.active] : null;\n    const t = this.state.tick;\n    const idx = this.state.idx;\n    const f = Object.assign({ score: '', company: '', platforms: '', time: '', position: '', engine: '' }, (this.facts[this.state.active] || {}));\n    if (p) { if (!f.position) f.position = p.role || ''; }\n    const heroPool = [];\n    if (idx) {\n      if (idx.hero) heroPool.push(idx.hero);\n      this.mains.concat(this.also).forEach(id => { const c = this.entry(id).cover; if (c && heroPool.indexOf(c) === -1) heroPool.push(c); });\n    }\n    const phrases = [\n      ['Grey boxes in.', 'Shipped worlds out.'],\n      ['Paper designs in.', 'Combat encounters out.'],\n      ['Blockouts in.', 'Player stories out.'],\n      ['Metrics & tilesets in.', 'Puzzles players remember.'],\n      ['Ideas in.', 'Levels that ship.']\n    ];\n    const ph = phrases[Math.floor(t / 3) % phrases.length];\n    const lc = (k) => t > k ? Math.floor((t - 1 - k) / 5) + 1 : 0;\n    const vals = {\n      phraseA: ph[0],\n      phraseB: ph[1],\n      slides: {\n        hero: this.mkSlide(heroPool, t),\n        cp: this.mkSlide(this.shotsOf('cp'), lc(1)),\n        rime: this.mkSlide(this.shotsOf('rime'), lc(2)),\n        deadlight: this.mkSlide(this.shotsOf('deadlight'), lc(3)),\n        gylt: this.mkSlide(this.shotsOf('gylt'), lc(4)),\n        nunu: this.mkSlide(this.shotsOf('nunu'), lc(5))\n      },\n      alsoList: this.also.map(id => this.card(id)),\n      personalList: this.personalIds.map(id => this.card(id)),\n      sliderRef: (el) => { this.sliderEl = el; },\n      pSliderRef: (el) => { this.pSliderEl = el; },\n      slideLeft: () => this.scrollBy(this.sliderEl, -2),\n      slideRight: () => this.scrollBy(this.sliderEl, 2),\n      pSlideLeft: () => this.scrollBy(this.pSliderEl, -2),\n      pSlideRight: () => this.scrollBy(this.pSliderEl, 2),\n      hasActive: !!p,\n      pTitle: p ? p.title : '', pMeta: p ? p.meta : '', pRole: p ? p.role : '',\n      pDesc: p ? p.desc : '', pResp: p ? (p.resp || []) : [],\n      pScore: f.score, pHasScore: !!f.score, pCompany: f.company, pPlatforms: f.platforms,\n      pTime: f.time, pPosition: f.position, pEngine: f.engine,\n      pAbout: (this.abouts[this.state.active] || (p ? p.desc : '') || ''),\n      prevProject: () => this.step(-1),\n      nextProject: () => this.step(1),\n      closeProject: () => this.setState({ active: null })\n    };\n    this.mains.forEach(id => { vals['open_' + id] = () => this.open(id); });\n    if (!p) {\n      return Object.assign(vals, { selIsVideo: false, selIsImage: false, noMedia: false, hasThumbs: false, pThumbs: [], selUrl: '', mediaCounter: '', noMediaLabel: '', thumbArrowBorder: '#3a372f', thumbArrowColor: '#55524a' });\n    }\n    const shots = this.shotsOf(this.state.active);\n    const media = [].concat((p.videos || []).map(v => ({ type: 'video', url: v })), shots.map(s => ({ type: 'image', url: s })));\n    const i = Math.min(this.state.mediaIdx || 0, Math.max(media.length - 1, 0));\n    const sel = media[i];\n    const many = media.length > 1;\n    return Object.assign(vals, {\n      selIsVideo: !!sel && sel.type === 'video',\n      selIsImage: !!sel && sel.type === 'image',\n      noMedia: media.length === 0,\n      noMediaLabel: (p.meta || '').indexOf('NDA') > -1 ? 'MATERIAL UNDER NDA' : 'IMAGES COMING SOON',\n      selUrl: sel ? sel.url : '',\n      mediaCounter: media.length ? (i + 1) + ' / ' + media.length : '',\n      hasThumbs: many,\n      thumbArrowBorder: media.length > 10 ? '#55524a' : '#3a372f',\n      thumbArrowColor: media.length > 10 ? '#ece7de' : '#55524a',\n      thumbsRef: (el) => { this.thumbsEl = el; },\n      thumbsLeft: () => this.scrollThumbs(-1),\n      thumbsRight: () => this.scrollThumbs(1),\n      mediaPrev: () => this.setState({ mediaIdx: (i - 1 + media.length) % media.length }),\n      mediaNext: () => this.setState({ mediaIdx: (i + 1) % media.length }),\n      pThumbs: media.map((m, n) => ({\n        img: m.type === 'image' ? m.url : '',\n        isVideo: m.type === 'video',\n        border: n === i ? '#d4a24e' : '#2a2823',\n        pick: () => this.setState({ mediaIdx: n })\n      }))\n    });\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
